[project]
name = "lcn2mqtt"
version = "0.1.0"
description = "Bridge between LCN (Local Control Network) and MQTT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pypck>=0.7.27",
    "aiomqtt>=2.3.0",
    "pydantic-settings>=2.14.1",
    "pre-commit>=4.6.0",
]

[project.scripts]
lcn2mqtt = "lcn2mqtt.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcn2mqtt"]
