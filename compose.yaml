services:
  lcn2mqtt:
    build: .
    image: lcn2mqtt:latest
    container_name: lcn2mqtt
    restart: unless-stopped
    environment:
      LCN2MQTT__RUNNING_IN_DOCKER: true
    env_file:
      - path: ./stack.env
        required: false
      - path: ./.env
        required: false

    ports:
      # host port follows LCN2MQTT__WEBUI__PORT env var, which must match webui.port in configuration.yaml
      - "${LCN2MQTT__WEBUI__PORT:-8080}:8080"
    volumes:
      - ${LCN2MQTT__CONFIG_PATH:-./data}:/lcn2mqtt/data
